<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catherina.dev — Application Store & Portfolio</title>
    <meta name="description"
        content="Curated collection of specialized web applications, progressive web apps, and creative tools crafted by Catherina.">

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://catherina.dev/">
    <meta property="og:title" content="catherina.dev — App Store">
    <meta property="og:description"
        content="Discover specialized web apps, musician tools, and PWAs crafted by Catherina.">
    <meta property="og:image" content="assets/icons/score-tone.png">

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=2">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>
    <div class="bg-ambient" aria-hidden="true"></div>

    <!-- Header Navigation -->
    <header class="site-header">
        <div class="container nav-content">
            <a href="#" class="brand" aria-label="catherina.dev home">
                <div class="brand-icon">C</div>
                <div class="brand-text">
                    <span class="brand-name">catherina.dev</span>
                </div>
            </a>
            <div class="header-actions">
                <a href="https://github.com/catIO" target="_blank" rel="noopener noreferrer" class="github-link"
                    aria-label="GitHub Profile (catIO)">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                    </svg>
                </a>
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Minimal Hero Section -->
        <section class="hero-section">
            <h1 class="hero-title">catherina.dev</h1>
            <p class="hero-description">
                Specialized web apps, musician tools, and creative experiments.
            </p>
        </section>

        <!-- Controls: Search & Category Filters -->
        <div class="controls-bar">
            <div class="search-wrapper">
                <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" class="search-input" placeholder="Search apps or tools..."
                    aria-label="Search applications">
                <button type="button" id="search-clear" class="search-clear" aria-label="Clear search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <nav class="category-filters" aria-label="Filter applications by category">
                <button type="button" class="category-btn active" data-category="all">All</button>
                <button type="button" class="category-btn" data-category="music">Music</button>
                <button type="button" class="category-btn" data-category="productivity">Productivity</button>
                <button type="button" class="category-btn" data-category="tools">Tools</button>
                <button type="button" class="category-btn" data-category="creative">Creative</button>
            </nav>
        </div>

        <!-- App Store Grid -->
        <div class="apps-count-label" id="apps-count">All Apps</div>
        <section class="apps-grid" id="apps-grid" aria-live="polite">
            <!-- Rendered dynamically by app.js as minimalist icon grid -->
        </section>
    </main>

    <!-- Modal Dialog Sheet -->
    <div class="modal-backdrop" id="app-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-dialog">
            <button type="button" class="modal-close-btn" id="modal-close" aria-label="Close application details">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="modal-content-inner" id="modal-content">
                <!-- Rendered dynamically by app.js -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-links">
                <a href="https://microsaurus.com" class="footer-link">Microsaurus</a>
                <span>•</span>
                <a href="https://github.com/catIO" target="_blank" rel="noopener noreferrer"
                    class="footer-link">GitHub</a>
            </div>
            <p>© 2026 Catherina</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/apps-data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
